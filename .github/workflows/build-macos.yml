name: macOS Universal DMG + ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Universal DMG + ZIP
        run: npm run build:mac:universal

      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ezi-Client-macOS-Universal
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
