name: Build Ezi Client for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal DMG + ZIP
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build universal macOS package
        run: npm run build:mac:universal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ezi-Client-1.0.0-macOS-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release assets for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
